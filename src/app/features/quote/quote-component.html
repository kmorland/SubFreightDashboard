<h2>Generate Quote</h2>
<h6>Follow the steps to create quote, retrieve the options, and start a shipment</h6>
<mat-stepper [linear]="true" #stepper isNavigable="false">
  <mat-step label="Create Quote">
    
    <form (submit)="onSubmit($event)">
      <div class="flex flex-col lg:flex-row gap-4 mb-4 mt-10">
        <div class="w-full lg:w-1/2">
          <app-origin [originForm]="quoteForm.origin" (addressSelected)="onOriginAddressSelectedFn($event)" (accessorialChange)="onAccessorialOriginChange($event)" />
        </div>
        <div class="w-full lg:w-1/2">
          <app-destination [destinationForm]="quoteForm.destination" (addressSelected)="onDestinationAddressSelectedFn($event)" (accessorialChange)="onAccessorialDestinationChange($event)" />
        </div>
      </div>
    
      <div class="flex w-full mt-10">
        <app-shipment-items
          (densityCalculator)="openDensityCalculator()"
          (addItemRow)="onAddItemRow()"
          (removeItemRow)="onRemoveItemRow($event)"
          [quoteForm]="quoteForm"
          >
        </app-shipment-items>
      </div>
    
      <div class="flex mt-10">
        <div class="w-1/2">
          <app-additional-details />
        </div>
        <div class="w-1/2">
          <button matButton="filled" (click)="onReset()">Reset</button>
          <button matButton="filled">Submit</button>
        </div>
      </div>
      
    </form>
    
    
  </mat-step>
  <mat-step label="Quote Results">
    <app-quote-results />
  </mat-step>
  <mat-step label="Create shipment">
    
  </mat-step>
</mat-stepper>
