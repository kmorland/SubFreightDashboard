<!-- Unit Type -->
<td>
        <select placeholder="Select..." [field]="itemForm().packageType" class="w-22 border-1 rounded p-1" (change)="onUnitTypeChangeHandler($event)">
                <option value="">Select...</option>
            @for (item of unitTypes | keyvalue: originalOrder; track $index) {
                <option [value]="item.key">{{ item.value }}</option>
            }
        </select>
        <!-- <mat-form-field appearance="outline">
            <mat-select placeholder="Select..." panelClass="">
                @for (type of unitTypes; track type) {
                <mat-option [value]="type">{{ type }}</mat-option>
                }
            </mat-select>
        </mat-form-field> -->
    </td>

    <!-- # of Units -->
    <td>
        <input type="number" class="border-1 rounded w-14 p-1" [field]="itemForm().palletCount" />
        <!-- <mat-form-field appearance="outline">
            <input matInput type="number" />
        </mat-form-field> -->
    </td>

    <!-- Description/Commodity -->
    <td>
        <select class="w-32 border-1 rounded p-1" (change)="onDescriptionChange($event)" [field]="itemForm().description">
            <option>Select...</option>
            @for (item of descriptions; track $index) {
                <option [value]="$index">{{ item.description }}-{{item.productClass}}</option>
            }
        </select>
        <!-- <mat-form-field appearance="outline">
            <input matInput />
            <button mat-icon-button matSuffix type="button">
                <mat-icon>expand_more</mat-icon>
            </button>
        </mat-form-field> -->
    </td>

    <!-- NMFC -->
    <td>
        <input [field]="itemForm().nmfcNumber" class="w-14 border-1 rounded p-1" />
        <!-- <mat-form-field appearance="outline">
            <input matInput />
        </mat-form-field> -->
    </td>

    <!-- Class -->
    <td>
        <mat-form-field appearance="outline">
            <mat-select [field]="itemForm().productClass" panelClass="item-select-panel">
                @for (classOption of productClassOptions; track classOption) {
                <mat-option [value]="classOption">{{ classOption }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </td>

    <!-- # of Pcs -->
    <td>
        <input type="number" [field]="itemForm().pieceCount" class="border-1 rounded p-1 w-14" />
        <!-- <mat-form-field appearance="outline">
            <input matInput type="number" />
        </mat-form-field> -->
    </td>

    <!-- Weight -->
    <td>
        <input type="number" placeholder="W" [field]="itemForm().weight" class="w-12 border-1 rounded p-1" />
        <!-- <mat-form-field appearance="outline">
            <input matInput type="number" />
        </mat-form-field> -->
        <mat-button-toggle-group hideSingleSelectionIndicator="true" [field]="itemForm().weightType">
            <mat-button-toggle value="1">LB</mat-button-toggle>
            <mat-button-toggle value="0">KG</mat-button-toggle>
        </mat-button-toggle-group>
    </td>

        <!-- Dimensions -->
    <td>
        <div class="flex-row">
            <input type="number" placeholder="L" [field]="itemForm().length" class="w-8 border-1 rounded p-1"  />
            <input type="number" placeholder="W" [field]="itemForm().width" class="w-8 border-1 rounded p-1"  />
            <input type="number" placeholder="H" [field]="itemForm().height" class="w-8 border-1 rounded p-1"  />
            <!-- <mat-form-field class="w-12 no-padding" subscriptSizing="dynamic">
                <input matInput type="number" placeholder="L" />
            </mat-form-field> -->
            <!-- <mat-form-field appearance="outline" class="w-12">
                <input matInput type="number" placeholder="W" class="w-6" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-12">
                <input matInput type="number" placeholder="H" />
            </mat-form-field> -->
            <mat-button-toggle-group hideSingleSelectionIndicator="true">
                <mat-button-toggle>IN</mat-button-toggle>
                <mat-button-toggle>FT</mat-button-toggle>
            </mat-button-toggle-group>
        </div>
    </td>
    <!-- [class.active]="itemModel().dimensions.unit.value() === 'FT'" -->
    <!-- [class.active]="itemModel().dimensions.unit.value() === 'IN'" -->

    <!-- Density -->
    <td>
        <input type="number" class="w-14 border-1 rounded p-1" />
        <!-- <mat-form-field appearance="outline">
            <input matInput type="number" />
        </mat-form-field> -->
    </td>

    <!-- Stackable -->
    <td>
        <mat-button-toggle value="false" [value]="itemForm().stackable">Stackable</mat-button-toggle>
    </td>



<!-- Hazmat -->
<td>
    <mat-button-toggle value="false" [value]="itemForm().hazmat">Hazmat</mat-button-toggle>
</td>

<!-- Delete -->
<div class="item-field delete-field">
    <label class="field-label">&nbsp;</label>
    <button type="button" mat-icon-button (click)="onDelete()" matTooltip="Delete item" aria-label="Delete item">
        <mat-icon>delete</mat-icon>
    </button>
</div>
