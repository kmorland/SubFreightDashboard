<div class="quote-results-container flex h-full">
  <!-- Sidebar -->
  @if (summary()) {
    <app-results-sidebar
      [summary]="summary()!"
      (reRate)="onReRate()">
    </app-results-sidebar>
  }

  <!-- Main Content -->
  <div class="results-main flex-1 p-4 overflow-auto">
    <!-- Sort Tabs and Search -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
      <!-- Sort Tabs -->
      <div class="flex gap-2">
        @for (option of sortOptions; track option.value) {
          <button
            mat-stroked-button
            [class.bg-gray-100]="sortOption() === option.value"
            [class.font-semibold]="sortOption() === option.value"
            (click)="onSortChange(option.value)">
            {{ option.label }}
          </button>
        }
      </div>

      <!-- Search -->
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput
               placeholder="Search for a Carrier"
               (input)="onSearch($any($event.target).value)">
      </mat-form-field>
    </div>

    <!-- Results List -->
    <div class="results-list">
      @for (result of filteredResults; track result.id) {
        <app-result-card
          [result]="result"
          (bookWithInsurance)="onBookWithInsurance($event)"
          (bookWithoutInsurance)="onBookWithoutInsurance($event)"
          (saveQuote)="onSaveQuote($event)"
          (addToFavorites)="onAddToFavorites($event)"
          (modifyDeclaredValue)="onModifyDeclaredValue($event)">
        </app-result-card>
      } @empty {
        <div class="text-center py-8 text-gray-500">
          @if (results().length === 0) {
            <mat-spinner diameter="40" class="mx-auto mb-4"></mat-spinner>
            <p>Loading quote results...</p>
          } @else {
            <p>No carriers match your search criteria.</p>
          }
        </div>
      }
    </div>
  </div>
</div>
